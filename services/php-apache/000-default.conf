<VirtualHost *:80>
    ServerAdmin ${APACHE_SERVER_ADMIN}
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Order Allow,Deny
        Allow from All

        <IfModule mod_rewrite.c>
            RewriteEngine On

            # Apache nie przekazuje nagłówka Authorization do PHP. Odpowiednik reguły
            # z public/.htaccess, który tu nie działa przez AllowOverride None.
            RewriteCond %{HTTP:Authorization} .+
            RewriteRule ^ - [E=HTTP_AUTHORIZATION:%0]

            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>
</VirtualHost>